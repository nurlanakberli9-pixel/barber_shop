services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD verilməlidir}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - barber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  barber_pgdata:
