<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarberConnect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#eef0f4;color:#1c2536}
header{background:#fff;padding:14px 16px;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}
main{max-width:960px;margin:0 auto;padding:16px}
.hero{background:#3f5470;color:#fff;border-radius:14px;padding:18px;margin-bottom:16px}
.hero h1{margin:0 0 12px;font-size:20px;text-align:center}
.hero input{width:100%;border:0;border-radius:10px;padding:12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);text-align:center;padding-bottom:12px;cursor:pointer}
.card .top{background:#3f5470;height:46px}
.avatar{width:72px;height:72px;border-radius:50%;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:-36px auto 8px;border:3px solid #fff}
.card b{display:block;font-size:16px}
.card .shop{font-size:13px;color:#555;padding:0 8px;min-height:34px}
.stars{color:#f5a623;font-size:14px;margin:4px 0 8px}
.btn{background:#22a845;color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer;width:calc(100% - 24px)}
.btn:active{background:#1b8a39}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:#3f5470;font:inherit;cursor:pointer;padding:0;margin-bottom:12px}
.panel{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.head{display:flex;align-items:center;gap:12px}
.head .avatar{margin:0;width:56px;height:56px;flex:0 0 56px;font-size:22px}
.head h2{margin:0;font-size:18px}
.head .stars{margin:2px 0}
.muted{color:#667;font-size:14px}
.muted.bad{color:#a11}
.msg{padding:12px;border-radius:10px;background:#fde2e2;color:#a11;margin-top:10px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthbar b{font-size:17px}
.arrow{width:42px;height:42px;border-radius:10px;border:1px solid #d5d9e0;background:#fff;font-size:20px;cursor:pointer}
.arrow:disabled{opacity:.35;cursor:default}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;position:relative}
.day{flex:0 0 58px;background:#fff;border:1px solid #d5d9e0;border-radius:12px;padding:8px 0;text-align:center;font:inherit;color:inherit;cursor:pointer}
.day small{display:block;font-size:11px;color:#667}
.day b{display:block;font-size:20px}
.day.sel{background:#3f5470;color:#fff;border-color:#3f5470}
.day.sel small{color:#cfd8e6}
.day:disabled{opacity:.4;cursor:default}
.bars{display:flex;gap:2px;justify-content:center;margin-top:6px}
.bars i{width:7px;height:7px;border-radius:2px;background:#ccd}
.bars i.g{background:#22a845}
.bars i.r{background:#a32020}
.legend{display:flex;gap:14px;font-size:13px;color:#667;margin:8px 0 4px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;background:var(--c);border:1px solid #c5ccd8;vertical-align:-2px}
.rangehead{font-weight:700;margin-top:16px}
.minhead{display:flex;gap:8px;align-items:center;position:sticky;top:54px;background:#fff;z-index:4;padding:4px 0;margin-top:10px}
.hlsp{flex:0 0 40px}
.hour{display:flex;gap:8px;align-items:center;margin-top:6px}
.hl{flex:0 0 40px;font-size:12px;color:#667;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;border-radius:4px;font-family:inherit}
.hl.on{background:#f5a623;color:#fff;font-weight:700;text-align:center}
.cells{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.mh{height:22px;font-size:10px;border:0;border-radius:4px;background:#eef0f4;color:#445;padding:0;cursor:pointer;font-family:inherit}
.mh.on{background:#f5a623;color:#fff;font-weight:700}
.cell{height:34px;padding:0;border:1px solid #c5ccd8;border-radius:4px;background:#fff;cursor:pointer}
.cell.busy{background:#c0392b;border-color:#c0392b;cursor:default}
.cell.past{background:#d5d8de;border-color:#d5d8de;cursor:default}
.cell.on{background:#3f5470;border-color:#3f5470}
.cell.hlc{box-shadow:inset 0 0 0 2px #f5a623}
.busytext{font-size:13px;color:#a11;margin-top:8px}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;max-height:62vh;overflow-y:auto;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;background:#3f5470;color:#fff;margin:-16px -16px 12px;padding:12px 16px;border-radius:18px 18px 0 0}
.x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.sheet input{width:100%;margin-top:10px;padding:12px;border:1px solid #ccd;border-radius:10px;font:inherit}
.sheet .btn{width:100%;margin-top:12px;padding:14px}
.cubes{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.cubebtn{width:100%;font:inherit;text-align:left;border:1px solid #c5ccd8;border-radius:10px;background:#fff;color:#1c2536;padding:12px;cursor:pointer}
.cubebtn.on{background:#3f5470;color:#fff;border-color:#3f5470}
.cubebtn:disabled{opacity:.4;cursor:default}
.levels{display:none;gap:6px;flex-wrap:wrap;margin:6px 0 0 8px}
.chip{font:inherit;font-size:13px;border:1px solid #c5ccd8;border-radius:16px;background:#fff;color:#1c2536;padding:8px 10px;cursor:pointer}
.chip.on{background:#22a845;border-color:#22a845;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;z-index:30;max-width:90%;text-align:center}
.toast.ok{background:#1b8a39}
.toast.err{background:#a32020}
</style>
</head>
<body>
<header>✂ BarberConnect</header>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const $ = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); e.append(...k); return e; };
const COLORS = ['#c0562f', '#2f7bc0', '#7b4fc0', '#2fa086', '#b8860b', '#c02f6b'];
const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
const WD = ['Baz', 'B.e', 'Ç.a', 'Çər', 'C.a', 'Cüm', 'Şən'];
const ICONS = { HAIRCUT: '✂️', WASH: '🚿', BEARD: '🧔' };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
let shops = [];
let query = '';
let sheetEl = null;

function removeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
function toast(text, type) {
  const t = $('div', { className: 'toast ' + type, textContent: text });
  document.body.append(t);
  setTimeout(() => t.remove(), 4500);
}
function avatar(s) {
  const a = $('div', { className: 'avatar', textContent: s.masterName.slice(0, 1).toUpperCase() });
  a.style.background = COLORS[s.id % COLORS.length];
  return a;
}
function stars(r) {
  const full = Math.round(r);
  return '★'.repeat(full) + '☆'.repeat(5 - full) + ' ' + r.toFixed(1);
}
async function getJson(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return { status: r.status, data: null };
    return { status: r.status, data: await r.json() };
  } catch (e) {
    return { status: 0, data: null };
  }
}

function homeView() {
  const search = $('input', { type: 'search', placeholder: 'Bərbər, usta və ya ünvan axtarın...', value: query });
  const grid = $('div', { className: 'grid' });
  search.oninput = () => { query = search.value; fill(); };
  function fill() {
    const q = query.trim().toLowerCase();
    const list = shops.filter(s =>
      (s.name + ' ' + s.masterName + ' ' + s.address).toLowerCase().includes(q));
    grid.replaceChildren(...(list.length ? list.map(card)
      : [$('p', { className: 'muted', textContent: 'Heç nə tapılmadı' })]));
  }
  fill();
  app.replaceChildren(
    $('div', { className: 'hero' }, $('h1', { textContent: 'Bərbər seçin' }), search),
    grid);
}

function card(s) {
  const c = $('div', { className: 'card' },
    $('div', { className: 'top' }), avatar(s),
    $('b', { textContent: s.masterName + ' @' }),
    $('div', { className: 'shop', textContent: s.name }),
    $('div', { className: 'stars', textContent: stars(s.rating) }),
    $('button', { className: 'btn', textContent: 'BOOK NOW' }));
  c.onclick = () => shopView(s);
  return c;
}

async function shopView(s) {
  removeSheet();
  const back = $('button', { className: 'link', textContent: '← Bütün bərbərlər' });
  back.onclick = () => { removeSheet(); homeView(); };
  const head = $('div', { className: 'panel head' }, avatar(s),
    $('div', {},
      $('h2', { textContent: s.masterName + ' @ ' + s.name }),
      $('div', { className: 'stars', textContent: stars(s.rating) }),
      $('div', { className: 'muted', textContent: '📍 ' + s.address })));
  app.replaceChildren(back, head, $('p', { className: 'muted', textContent: 'Yüklənir...' }));

  let avail = {};
  async function loadCalendar() {
    const r = await getJson(`/api/shops/${s.id}/calendar?days=60`);
    if (r.status !== 200 || !Array.isArray(r.data) || !r.data.length) return false;
    avail = {};
    r.data.forEach(d => { avail[d.date] = d; });
    return true;
  }
  const [okCal, sv] = await Promise.all([loadCalendar(), getJson(`/api/shops/${s.id}/services`)]);
  if (!okCal) {
    app.replaceChildren(back, head, $('div', { className: 'msg', textContent: 'Tarixləri yükləmək alınmadı. Yenidən cəhd edin.' }));
    return;
  }
  const svcList = (sv.status === 200 && Array.isArray(sv.data)) ? sv.data : [];
  const todayKey = iso(new Date());
  const keys = Object.keys(avail).sort();
  const openKeys = keys.filter(k => avail[k].workMinutes > 0);
  if (!openKeys.length) {
    app.replaceChildren(back, head, $('div', { className: 'msg', textContent: 'Bərbər hələ iş saatlarını qurmayıb.' }));
    return;
  }
  const minMonth = new Date(); minMonth.setDate(1);
  const last = new Date(keys[keys.length - 1] + 'T00:00:00');
  const maxMonth = new Date(last.getFullYear(), last.getMonth(), 1);
  let selected = openKeys[0];
  let month = new Date(parseInt(selected.slice(0, 4), 10), parseInt(selected.slice(5, 7), 10) - 1, 1);
  let buttons = {};
  let day = null;
  let sel = null;
  let chosen = new Map();
  let notice = '';
  let hlCol = null;
  let hlRow = null;
  let refs = null;
  let dayToken = 0;

  const label = $('b');
  const prev = $('button', { className: 'arrow', textContent: '‹', ariaLabel: 'Əvvəlki ay' });
  const next = $('button', { className: 'arrow', textContent: '›', ariaLabel: 'Növbəti ay' });
  const strip = $('div', { className: 'strip' });
  const detail = $('div', { className: 'panel' });
  const monthbar = $('div', { className: 'monthbar' }, prev, label, next);

  function bars(key, past) {
    const st = avail[key];
    const wrap = $('div', { className: 'bars' });
    let g = 0, red = false;
    if (!past && st && st.workMinutes > 0) {
      red = true;
      if (st.freeMinutes > 0) g = Math.max(1, Math.round(st.freeMinutes / st.workMinutes * 5));
    }
    for (let i = 0; i < 5; i++) wrap.append($('i', { className: i < g ? 'g' : red ? 'r' : '' }));
    return wrap;
  }

  function buildStrip() {
    buttons = {};
    const y = month.getFullYear(), m = month.getMonth();
    label.textContent = MONTHS[m] + ' ' + y;
    prev.disabled = month <= minMonth;
    next.disabled = month >= maxMonth;
    const n = new Date(y, m + 1, 0).getDate();
    const items = [];
    for (let d = 1; d <= n; d++) {
      const date = new Date(y, m, d);
      const key = iso(date);
      const past = key < todayKey;
      const closed = !avail[key] || avail[key].workMinutes === 0;
      const b = $('button', { className: 'day', disabled: past || closed },
        $('small', { textContent: WD[date.getDay()] }),
        $('b', { textContent: String(d) }),
        bars(key, past));
      b.onclick = () => { selected = key; markSelected(); };
      buttons[key] = b;
      items.push(b);
    }
    strip.replaceChildren(...items);
    markSelected();
  }

  function markSelected() {
    Object.entries(buttons).forEach(([k, b]) => b.classList.toggle('sel', k === selected));
    const b = buttons[selected];
    if (b) strip.scrollLeft = b.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2;
    renderDay();
  }

  const status = m => m < day.earliest ? 'past'
    : day.busy.some(b => m >= b.start && m < b.end) ? 'busy' : 'free';

  function freeRun(a, b) {
    const r = day.ranges.find(x => a >= x.start && a < x.end);
    if (!r || b > r.end) return false;
    for (let m = a; m < b; m += day.step) if (status(m) !== 'free') return false;
    return true;
  }

  function total() {
    if (!chosen.size) return null;
    let sum = 0;
    for (const [code, lv] of chosen) {
      const x = svcList.find(v => v.code === code);
      if (!x) return null;
      sum += x.levels ? x[lv.toLowerCase()] : x.minutes;
    }
    return sum;
  }

  function autoFit() {
    notice = '';
    const t = total();
    if (!t || !sel) return;
    if (sel.end - sel.start === t) return;
    if (freeRun(sel.start, sel.start + t)) sel = { start: sel.start, end: sel.start + t };
    else notice = `Bu başlanğıcdan sonra ${t} dəq (${t / day.step} kub) boş yer yoxdur. Başqa başlanğıc kub seçin.`;
  }

  function tap(m) {
    if (status(m) !== 'free') return;
    notice = '';
    const t = total();
    if (t) {
      if (freeRun(m, m + t)) sel = { start: m, end: m + t };
      else {
        notice = `Buradan ${t} dəq (${t / day.step} kub) boş yer yoxdur.`;
        if (!sel) toast(notice, 'err');
      }
      paintDay();
      updateSheet();
      return;
    }
    if (!sel) {
      sel = { start: m, end: m + day.step };
    } else if (m >= sel.end) {
      if (freeRun(sel.start, m + day.step)) sel = { start: sel.start, end: m + day.step };
      else sel = { start: m, end: m + day.step };
    } else if (m < sel.start) {
      if (freeRun(m, sel.end)) sel = { start: m, end: sel.end };
      else sel = { start: m, end: m + day.step };
    } else if (m === sel.start) {
      sel = null;
    } else {
      sel = { start: sel.start, end: m };
    }
    paintDay();
    updateSheet();
  }

  function resetSelection() {
    sel = null;
    chosen = new Map();
    notice = '';
    removeSheet();
    detail.style.paddingBottom = '';
  }

  async function renderDay() {
    const token = ++dayToken;
    resetSelection();
    detail.replaceChildren($('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const r = await getJson(`/api/shops/${s.id}/day?date=${selected}`);
    if (token !== dayToken) return;
    if (r.status !== 200 || !r.data) {
      detail.replaceChildren($('div', { className: 'msg', textContent: 'Məlumatı yükləmək alınmadı. Başqa gün seçib yenidən cəhd edin.' }));
      return;
    }
    day = r.data;
    paintDay();
  }

  function paintDay() {
    const d = new Date(selected + 'T00:00:00');
    const els = [$('b', { textContent: `📅 ${d.getDate()} ${MONTHS[d.getMonth()]}, ${WD[d.getDay()]}` })];
    if (!day.ranges.length) {
      els.push($('p', { className: 'muted', textContent: 'Bu gün bərbərin iş saatı yoxdur.' }));
      detail.replaceChildren(...els);
      return;
    }
    const legend = $('div', { className: 'legend' },
      $('span', { textContent: 'Boş' }), $('span', { textContent: 'Dolu' }),
      $('span', { textContent: 'Seçilmiş' }), $('span', { textContent: 'Keçmiş' }));
    ['#ffffff', '#c0392b', '#3f5470', '#d5d8de'].forEach((c, i) => legend.children[i].style.setProperty('--c', c));
    els.push(legend);
    els.push($('p', { className: 'muted', textContent: 'Hər kub 5 dəqiqədir. Başlanğıc kuba toxunun, sonra xidmətləri seçin. Yuxarıdakı dəqiqəyə və ya soldakı saata toxunsanız həmin sütun və sətir işıqlanır.' }));

    const minhead = $('div', { className: 'minhead' }, $('span', { className: 'hlsp' }));
    const mcells = $('div', { className: 'cells' });
    for (let i = 0; i < 12; i++) {
      const b = $('button', { type: 'button', className: 'mh' + (hlCol === i ? ' on' : ''), textContent: pad(i * day.step), ariaLabel: `${pad(i * day.step)} dəqiqə sütunu` });
      b.onclick = () => { hlCol = hlCol === i ? null : i; paintDay(); };
      mcells.append(b);
    }
    minhead.append(mcells);
    els.push(minhead);

    day.ranges.forEach(r => {
      els.push($('div', { className: 'rangehead', textContent: `${fmt(r.start)} – ${fmt(r.end)}` }));
      for (let h = Math.floor(r.start / 60); h * 60 < r.end; h++) {
        const cells = $('div', { className: 'cells' });
        for (let m = Math.max(r.start, h * 60); m < Math.min(r.end, h * 60 + 60); m += day.step) {
          const col = (m - h * 60) / day.step;
          const st = status(m);
          const on = sel && m >= sel.start && m < sel.end;
          const hl = hlCol === col || hlRow === h;
          const b = $('button', { type: 'button', className: 'cell ' + (on ? 'on' : st) + (hl ? ' hlc' : ''), ariaLabel: fmt(m) });
          b.style.gridColumn = String(col + 1);
          b.onclick = () => tap(m);
          cells.append(b);
        }
        const lab = $('button', { type: 'button', className: 'hl' + (hlRow === h ? ' on' : ''), textContent: pad(h) + ':00' });
        lab.onclick = () => { hlRow = hlRow === h ? null : h; paintDay(); };
        els.push($('div', { className: 'hour' }, lab, cells));
      }
    });
    const shown = [];
    day.ranges.forEach(r => day.busy.forEach(b => {
      const a = Math.max(r.start, b.start), z = Math.min(r.end, b.end);
      if (a < z) shown.push(`${fmt(a)}–${fmt(z)}`);
    }));
    if (shown.length) els.push($('div', { className: 'busytext', textContent: 'Dolu vaxtlar: ' + shown.join(', ') }));
    detail.replaceChildren(...els);
  }

  function afterChange() {
    autoFit();
    paintDay();
    updateSheet();
  }

  function ensureSheet() {
    if (sheetEl) return;
    const close = $('button', { className: 'x', type: 'button', textContent: '✕', ariaLabel: 'Bağla' });
    const time = $('b');
    const hint = $('p', { className: 'muted' });
    const rows = {};
    const box = $('div', { className: 'cubes' });
    svcList.forEach(x => {
      const ready = x.levels ? (x.low != null && x.medium != null && x.high != null) : x.minutes != null;
      const toggle = $('button', {
        type: 'button', className: 'cubebtn', disabled: !ready,
        textContent: `${ICONS[x.code] || ''} ${x.name}` + (x.levels ? '' : ` · ${x.minutes != null ? x.minutes + ' dəq' : 'müəyyən deyil'}`)
      });
      toggle.onclick = () => {
        if (chosen.has(x.code)) chosen.delete(x.code);
        else chosen.set(x.code, x.levels ? 'MEDIUM' : null);
        afterChange();
      };
      const chips = {};
      let levelRow = null;
      if (x.levels) {
        levelRow = $('div', { className: 'levels' });
        const noun = x.code === 'BEARD' ? 'saqqal' : 'saç';
        [['LOW', 'Az', x.low], ['MEDIUM', 'Orta', x.medium], ['HIGH', 'Çox', x.high]].forEach(([lv, word, mins]) => {
          const c = $('button', { type: 'button', className: 'chip', textContent: `${word} ${noun} · ${mins} dəq` });
          c.onclick = () => { chosen.set(x.code, lv); afterChange(); };
          chips[lv] = c;
          levelRow.append(c);
        });
      }
      rows[x.code] = { toggle, chips, levelRow };
      box.append($('div', {}, toggle, ...(levelRow ? [levelRow] : [])));
    });
    const name = $('input', { placeholder: 'Adınız', maxLength: 60, autocomplete: 'name' });
    const phone = $('input', { placeholder: '+994501234567', type: 'tel', maxLength: 16, autocomplete: 'tel' });
    const err = $('div');
    const ok = $('button', { className: 'btn', type: 'button', textContent: 'TƏSDİQ ET' });
    close.onclick = () => { resetSelection(); paintDay(); };
    ok.onclick = confirmBooking;
    sheetEl = $('div', { className: 'sheet' },
      $('div', { className: 'bar' }, $('b', { textContent: 'Rezerv' }), close),
      time, box, hint, name, phone, err, ok);
    document.body.append(sheetEl);
    refs = { time, hint, rows, name, phone, err, ok };
  }

  function updateSheet() {
    if (!sel) { removeSheet(); detail.style.paddingBottom = ''; return; }
    ensureSheet();
    const len = sel.end - sel.start;
    const t = total();
    refs.time.textContent = `${fmt(sel.start)} – ${fmt(sel.end)} · ${len} dəq (${len / day.step} kub)`;
    Object.entries(refs.rows).forEach(([code, r]) => {
      const on = chosen.has(code);
      r.toggle.classList.toggle('on', on);
      if (r.levelRow) {
        r.levelRow.style.display = on ? 'flex' : 'none';
        Object.entries(r.chips).forEach(([lv, c]) => c.classList.toggle('on', chosen.get(code) === lv));
      }
    });
    let valid = false;
    let hint;
    let bad = false;
    if (!t) {
      hint = 'Xidmət seçin';
    } else if (len === t) {
      valid = true;
      hint = `Xidmətlər: ${t} dəq (${t / day.step} kub)`;
    } else {
      bad = true;
      hint = notice || `Bu xidmətlər üçün ${t} dəq (${t / day.step} kub) lazımdır. Başlanğıc kubu dəyişin.`;
    }
    refs.hint.textContent = hint;
    refs.hint.className = 'muted' + (bad ? ' bad' : '');
    refs.ok.disabled = !valid;
    detail.style.paddingBottom = '480px';
  }

  async function confirmBooking() {
    const n = refs.name.value.trim();
    const p = refs.phone.value.trim();
    refs.err.className = ''; refs.err.textContent = '';
    if (!n || !/^\+?[0-9]{9,15}$/.test(p)) {
      refs.err.className = 'msg';
      refs.err.textContent = 'Ad və düzgün telefon yazın (məs. +994501234567)';
      return;
    }
    refs.ok.disabled = true;
    const body = {
      date: selected, startTime: fmt(sel.start), endTime: fmt(sel.end),
      services: [...chosen].map(([code, lv]) => lv ? { code, level: lv } : { code }),
      name: n, phone: p
    };
    let st = 0, data = null;
    try {
      const r = await fetch(`/api/shops/${s.id}/bookings`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      st = r.status;
      if (st === 200) data = await r.json();
    } catch (e) { st = 0; }
    if (st === 200 && data) {
      const d = new Date(selected + 'T00:00:00');
      toast(`Rezerv olundu: ${s.masterName}, ${d.getDate()} ${MONTHS[d.getMonth()]}, ${data.start}–${data.end}`, 'ok');
      resetSelection();
      await loadCalendar();
      buildStrip();
    } else if (st === 409) {
      toast('Bu vaxt artıq tutulub və ya uyğun deyil, yenidən seçin', 'err');
      resetSelection();
      await loadCalendar();
      buildStrip();
    } else {
      refs.ok.disabled = false;
      refs.err.className = 'msg';
      refs.err.textContent = st === 400
        ? 'Seçim, ad və ya telefon düzgün deyil'
        : 'Xəta baş verdi, bağlantını yoxlayıb yenidən cəhd edin';
    }
  }

  prev.onclick = () => {
    month = new Date(month.getFullYear(), month.getMonth() - 1, 1);
    const k = iso(month);
    selected = openKeys.find(x => x.slice(0, 7) === k.slice(0, 7) && x >= k) || selected;
    buildStrip();
  };
  next.onclick = () => {
    month = new Date(month.getFullYear(), month.getMonth() + 1, 1);
    const k = iso(month);
    selected = openKeys.find(x => x.slice(0, 7) === k.slice(0, 7)) || selected;
    buildStrip();
  };

  app.replaceChildren(back, head, monthbar, strip, detail);
  buildStrip();
}

async function init() {
  const r = await getJson('/api/shops');
  if (r.status !== 200 || !Array.isArray(r.data)) {
    app.replaceChildren($('div', { className: 'msg', textContent: 'Bərbərləri yükləmək alınmadı. Səhifəni yeniləyin.' }));
    return;
  }
  shops = r.data;
  homeView();
}
init();
</script>
</body>
</html>
