<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BarberConnect · Bərbər paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#eef0f4;color:#1c2536}
header{background:#fff;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header .brand{font-size:19px;font-weight:700}
header .tag{background:#3f5470;color:#fff;border-radius:8px;padding:3px 8px;font-size:12px}
header button{margin-left:auto}
main{max-width:640px;margin:0 auto;padding:16px}
.panel{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel h2{margin:0 0 10px;font-size:17px}
.muted{color:#667;font-size:14px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid #ccd;border-radius:10px;background:#fff}
label{display:block;font-size:13px;color:#667;margin:10px 0 4px}
button{font:inherit;border-radius:10px;border:0;padding:12px 16px;cursor:pointer;background:#3f5470;color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
button.green{background:#22a845}
button.small{padding:8px 12px;font-size:14px}
button.danger{background:#a32020}
button.ghost{background:#e3e7ee;color:#1c2536}
.full{width:100%;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:12px;border-radius:10px;margin-top:12px;background:#fde2e2;color:#a11}
.msg.ok{background:#d9f5e0;color:#146c2e}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eceef2}
.row:last-child{border-bottom:0}
.time{font-weight:700;width:52px;flex:0 0 52px}
.info{flex:1;min-width:0;font-size:14px}
.info b,.info a,.info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info a{color:#2f6fb0}
.chip{font-size:12px;border-radius:8px;padding:4px 8px;color:#fff;white-space:nowrap}
.chip.free{background:#22a845}
.chip.booked{background:#a32020}
.chip.past{background:#aab0bb}
.summary{display:flex;gap:14px;font-size:14px;margin-bottom:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;z-index:30;max-width:90%;text-align:center}
.toast.ok{background:#1b8a39}
.toast.err{background:#a32020}
.win{border:1px solid #d5d9e0;border-radius:12px;padding:12px;margin-top:12px}
.win>*+*{margin-top:10px}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wh+.wh{margin-top:10px}
.wh label{margin:0}
.wh select{width:auto;min-width:96px}
.cubes{display:flex;flex-wrap:wrap;gap:8px}
.cube{display:flex;align-items:center;gap:4px;background:#3f5470;color:#fff;border-radius:10px;padding:4px 4px 4px 10px;font-size:14px}
.cube button{background:none;color:#fff;padding:0;min-width:34px;min-height:34px;font-size:16px}
.addcube{background:#e3e7ee;color:#1c2536;padding:8px 10px;font-size:14px}
.werr{color:#a11;font-size:13px}
.stalenote{font-size:13px;color:#8a5a00;background:#fff4d6;border-radius:10px;padding:10px;margin-top:10px}
.auto{background:#f3f6fb;border:1px solid #d5d9e0;border-radius:12px;padding:12px;margin-top:12px}
.auto>*+*{margin-top:10px}
.selbox{display:flex;align-items:center;gap:8px;color:#1c2536;font-size:15px}
.selbox input{width:22px;height:22px;padding:0;margin:0}
.cancelled{background:#fff4d6;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}
.cancelled .crow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #f0e2b6}
.cancelled a{color:#2f6fb0}
.cancelled button{margin-top:8px}
</style>
</head>
<body>
<header>
  <span class="brand">✂ BarberConnect</span>
  <span class="tag">Bərbər paneli</span>
  <button id="logout" class="ghost small" hidden>Çıxış</button>
</header>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const logoutBtn = document.getElementById('logout');
const $ = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); e.append(...k); return e; };
const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
const LABEL = { FREE: 'Boş', BOOKED: 'Dolu', PAST: 'Keçmiş' };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = iso(new Date());
const maxKey = iso(new Date(Date.now() + 59 * 864e5));
let me = null;
let date = todayKey;
let dayToken = 0;

function toast(text, type) {
  const t = $('div', { className: 'toast ' + type, textContent: text });
  document.body.append(t);
  setTimeout(() => t.remove(), 4000);
}

async function csrf() {
  try { await fetch('/api/csrf'); } catch (e) { return ''; }
  const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : '';
}

async function call(method, url, body) {
  const headers = {};
  const init = { method, headers };
  if (method !== 'GET') headers['X-XSRF-TOKEN'] = await csrf();
  if (body !== undefined) {
    headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(url, init);
    const text = await r.text();
    let data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) {} }
    return { status: r.status, data };
  } catch (e) {
    return { status: 0, data: null };
  }
}

function showLogin(message, ok) {
  me = null;
  logoutBtn.hidden = true;
  const user = $('input', { type: 'text', autocomplete: 'username', autocapitalize: 'none', spellcheck: false, maxLength: 64 });
  const pass = $('input', { type: 'password', autocomplete: 'current-password', maxLength: 128 });
  const note = $('div');
  if (message) { note.className = 'msg' + (ok ? ' ok' : ''); note.textContent = message; }
  const btn = $('button', { className: 'green full', type: 'submit', textContent: 'Daxil ol' });
  const form = $('form', {},
    $('label', { textContent: 'İstifadəçi adı' }), user,
    $('label', { textContent: 'Parol' }), pass, btn, note);
  form.onsubmit = async e => {
    e.preventDefault();
    btn.disabled = true;
    note.className = ''; note.textContent = '';
    let status = 0;
    try {
      const token = await csrf();
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'X-XSRF-TOKEN': token, 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ username: user.value.trim(), password: pass.value })
      });
      status = r.status;
    } catch (err) { status = 0; }
    pass.value = '';
    if (status === 200) { boot(); return; }
    btn.disabled = false;
    note.className = 'msg';
    note.textContent =
      status === 401 ? 'İstifadəçi adı və ya parol səhvdir' :
      status === 429 ? 'Çox sayda səhv cəhd oldu. 15 dəqiqə sonra yenidən cəhd edin' :
      status === 403 ? 'Sessiya yenilənməlidir, səhifəni yeniləyin' :
      'Xəta baş verdi, bağlantını yoxlayıb yenidən cəhd edin';
  };
  app.replaceChildren($('div', { className: 'panel' }, $('h2', { textContent: 'Bərbər girişi' }), form));
}

function sessionExpired() {
  showLogin('Sessiya bitdi, yenidən daxil olun');
}

function servicesPanel() {
  const box = $('div', { className: 'panel' });
  const title = $('h2', { textContent: 'Xidmətlərim' });
  const inputs = {};
  const note = $('div');
  const sum = $('p', { className: 'muted' });
  const save = $('button', { className: 'green full', textContent: 'Müddətləri saxla' });

  function updateSum() {
    const v = Object.values(inputs).map(i => parseInt(i.value, 10));
    sum.textContent = v.length && v.every(n => n > 0)
      ? `Minimum iş aralığı: ${v.reduce((a, b) => a + b, 0)} dəqiqə (üç xidmətin cəmi)`
      : 'Minimum iş aralığı üçün üç xidmətin müddətini yazın';
  }

  function fill(data) {
    Object.keys(inputs).forEach(k => delete inputs[k]);
    const rows = data.services.map(s => {
      const inp = $('input', {
        type: 'number', inputMode: 'numeric', min: '5', max: '240', step: '5',
        placeholder: 'dəqiqə', value: s.durationMinutes == null ? '' : String(s.durationMinutes)
      });
      inp.oninput = updateSum;
      inputs[s.code] = inp;
      return $('div', {}, $('label', { textContent: `${s.name} (dəqiqə)` }), inp);
    });
    box.replaceChildren(title,
      $('p', { className: 'muted', textContent: 'Hər xidmətin nə qədər vaxt apardığını yazın.' }),
      ...rows, sum, save, note);
    updateSum();
  }

  async function load() {
    box.replaceChildren(title, $('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const r = await call('GET', '/api/panel/services');
    if (r.status === 401) return sessionExpired();
    if (r.status === 200 && r.data) fill(r.data);
    else box.replaceChildren(title, $('div', { className: 'msg', textContent: 'Xidmətləri yükləmək alınmadı. Səhifəni yeniləyin.' }));
  }

  save.onclick = async () => {
    note.className = ''; note.textContent = '';
    const services = Object.entries(inputs).map(([code, i]) => ({ code, durationMinutes: parseInt(i.value, 10) }));
    const bad = services.some(s => !(s.durationMinutes >= 5 && s.durationMinutes <= 240 && s.durationMinutes % 5 === 0));
    if (bad) {
      note.className = 'msg';
      note.textContent = 'Hər müddət 5 ilə 240 dəqiqə arasında və 5-in qatı olmalıdır';
      return;
    }
    save.disabled = true;
    const r = await call('PUT', '/api/panel/services', { services });
    save.disabled = false;
    if (r.status === 401) return sessionExpired();
    if (r.status === 200 && r.data) {
      fill(r.data);
      note.className = 'msg ok';
      note.textContent = 'Saxlanıldı';
      if (refreshDurations) refreshDurations();
    } else {
      note.className = 'msg';
      note.textContent = r.status === 400
        ? 'Müddətlər düzgün deyil (5-240 dəqiqə, 5-in qatı)'
        : 'Xəta baş verdi, yenidən cəhd edin';
    }
  };

  load();
  return box;
}

let reloadWindows = null;
let refreshDurations = null;
let windowsDirty = () => false;

function windowsPanel() {
  const KINDS = ['HAIRCUT', 'WASH', 'BEARD'];
  const NAMES = { HAIRCUT: 'Saç kəsimi', WASH: 'Saç yuma', BEARD: 'Saqqal kəsimi' };
  const ICONS = { HAIRCUT: '✂️', WASH: '🚿', BEARD: '🧔' };
  const MAX_WINDOWS = 20;
  const WORK_START = 8 * 60;
  const WORK_END = 22 * 60;
  const box = $('div', { className: 'panel' });
  const title = $('h2', { textContent: 'İş aralıqları' });
  let dur = null;
  let wins = [];
  let dirty = false;
  let stale = false;
  let token = 0;
  let note = null;
  let addCount = 1;
  let autoFrom = 8 * 60;
  let autoTo = 17 * 60;

  const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const toMin = t => parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10);

  function setDurations(data) {
    const m = {};
    let ok = true;
    data.services.forEach(x => { if (x.durationMinutes == null) ok = false; else m[x.code] = x.durationMinutes; });
    dur = ok && KINDS.every(k => m[k] > 0) ? m : null;
  }

  function fromServer(list) {
    wins = [];
    stale = false;
    let prevEnd = null;
    list.forEach(x => {
      const start = toMin(x.startTime);
      if (dur && x.cubes.some(c => c.minutes !== dur[c.code])) stale = true;
      wins.push({ manual: prevEnd === null || start !== prevEnd, start, cubes: x.cubes.map(c => c.code) });
      prevEnd = start + x.totalMinutes;
    });
  }

  function layout() {
    let prevEnd = null;
    return wins.map(w => {
      const total = w.cubes.reduce((a, c) => a + dur[c], 0);
      const start = (w.manual || prevEnd === null) ? w.start : prevEnd;
      const end = start + total;
      let err = '';
      if (total === 0) err = 'Pəncərədə ən azı bir kub olmalıdır';
      else if (start < WORK_START || end > WORK_END) err = 'Pəncərə 08:00-22:00 aralığından çıxır';
      else if (prevEnd !== null && start < prevEnd) err = 'Əvvəlki pəncərə ilə üst-üstə düşür';
      prevEnd = end;
      return { start, end, total, err };
    });
  }

  function touch() { dirty = true; note = null; render(); }

  function removeWindows(pred) {
    const info = layout();
    let removed = false;
    const keep = [];
    wins.forEach((w, i) => {
      if (pred(w, i)) { removed = true; return; }
      if (removed) { w.start = info[i].start; w.manual = true; }
      keep.push(w);
    });
    wins = keep;
  }

  function card(w, i, x) {
    const chk = $('input', { type: 'checkbox', checked: !!w.sel, ariaLabel: 'Seç' });
    chk.onchange = () => { w.sel = chk.checked; };
    const head = $('div', { className: 'wh' },
      $('label', { className: 'selbox' }, chk, $('b', { textContent: `Pəncərə ${i + 1}` })),
      $('span', { className: 'muted', textContent: `${fmt(x.start)} – ${fmt(x.end)} · ${x.total} dəq` }));

    const startRow = $('div', { className: 'wh' });
    if (i === 0 || w.manual) {
      const sel = $('select');
      const opts = [];
      for (let m = WORK_START; m < WORK_END; m += 15) opts.push(m);
      if (!opts.includes(x.start)) { opts.push(x.start); opts.sort((a, b) => a - b); }
      opts.forEach(m => sel.append($('option', { value: String(m), textContent: fmt(m) })));
      sel.value = String(x.start);
      sel.onchange = () => { w.start = parseInt(sel.value, 10); w.manual = true; touch(); };
      startRow.append($('label', { textContent: 'Başlama' }), sel);
      if (i > 0) {
        const b = $('button', { className: 'small ghost', textContent: 'Ardıcıl et' });
        b.onclick = () => { w.manual = false; touch(); };
        startRow.append(b);
      }
    } else {
      startRow.append($('span', { className: 'muted', textContent: 'Əvvəlki pəncərənin ardınca' }));
      const b = $('button', { className: 'small ghost', textContent: 'Vaxtı seç' });
      b.onclick = () => { w.manual = true; w.start = x.start; touch(); };
      startRow.append(b);
    }

    const cubes = $('div', { className: 'cubes' });
    w.cubes.forEach(code => {
      const rm = $('button', { textContent: '✕', ariaLabel: 'Kubu sil' });
      rm.onclick = () => { w.cubes = w.cubes.filter(c => c !== code); touch(); };
      cubes.append($('span', { className: 'cube' },
        $('span', { textContent: `${ICONS[code]} ${NAMES[code]} · ${dur[code]} dəq` }), rm));
    });
    KINDS.filter(k => !w.cubes.includes(k)).forEach(k => {
      const b = $('button', { className: 'addcube', textContent: `+ ${NAMES[k]} (${dur[k]})` });
      b.onclick = () => {
        w.cubes.push(k);
        w.cubes.sort((a, c) => KINDS.indexOf(a) - KINDS.indexOf(c));
        touch();
      };
      cubes.append(b);
    });

    const del = $('button', { className: 'small ghost', textContent: 'Pəncərəni sil' });
    del.onclick = () => { removeWindows((x, j) => j === i); touch(); };

    const el = $('div', { className: 'win' }, head, startRow, cubes, del);
    if (x.err) el.append($('div', { className: 'werr', textContent: x.err }));
    return el;
  }

  function render() {
    if (!dur) {
      box.replaceChildren(title, $('div', { className: 'msg', textContent: 'Əvvəl yuxarıdakı Xidmətlərim bölməsində üç xidmətin müddətini yazıb saxlayın.' }));
      return;
    }
    const info = layout();
    const hasErr = info.some(x => x.err);
    const d = new Date(date + 'T00:00:00');

    const countSel = $('select');
    for (let n = 1; n <= 10; n++) countSel.append($('option', { value: String(n), textContent: String(n) }));
    countSel.value = String(addCount);
    countSel.style.width = '80px';
    countSel.onchange = () => { addCount = parseInt(countSel.value, 10); };
    const addBtn = $('button', { className: 'small ghost', textContent: 'Pəncərə əlavə et' });
    addBtn.onclick = () => {
      const room = MAX_WINDOWS - wins.length;
      if (room <= 0) { toast('Bir günə ən çox 20 pəncərə olar', 'err'); return; }
      for (let n = 0; n < Math.min(addCount, room); n++) {
        wins.push({ manual: wins.length === 0, start: 10 * 60, cubes: [] });
      }
      touch();
    };
    const fillBtn = $('button', { className: 'small ghost', textContent: 'Mövcudları 3 kubla doldur' });
    fillBtn.onclick = () => {
      if (!wins.length) { toast('Əvvəl pəncərə əlavə edin', 'err'); return; }
      wins.forEach(w => { w.cubes = KINDS.slice(); });
      touch();
    };
    const clearBtn = $('button', { className: 'small ghost', textContent: 'Hamısını sil' });
    clearBtn.onclick = () => {
      if (wins.length && confirm('Bütün pəncərələr silinsin? Saxlamayana qədər serverdə dəyişmir.')) { wins = []; touch(); }
    };
    const delSel = $('button', { className: 'small ghost', textContent: 'Seçilənləri sil' });
    delSel.onclick = () => {
      if (!wins.some(w => w.sel)) { toast('Əvvəl silinəcək pəncərələri seçin', 'err'); return; }
      removeWindows(w => w.sel);
      touch();
    };
    const saveBtn = $('button', { className: 'green full', textContent: 'Yadda saxla' });
    saveBtn.disabled = !dirty || hasErr;
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      const saveDate = date;
      const payload = { windows: wins.map((w, i) => ({ startTime: fmt(info[i].start), cubes: w.cubes })) };
      const sortedSpans = info.map(x => [x.start, x.end]).sort((a, b) => a[0] - b[0]);
      const mergedSpans = [];
      sortedSpans.forEach(([a, b]) => {
        const last = mergedSpans[mergedSpans.length - 1];
        if (last && a <= last[1]) last[1] = Math.max(last[1], b); else mergedSpans.push([a, b]);
      });
      const stranded = dayBookings.filter(b => {
        const bs = toMin(b.start), be = toMin(b.end);
        return !mergedSpans.some(m => m[0] <= bs && be <= m[1]);
      });
      if (stranded.length) {
        const lines = stranded.map(b => `${b.start}–${b.end}  ${b.customerName}  ${b.customerPhone}`).join('\n');
        if (!confirm(`Bu dəyişiklik ${stranded.length} rezervi ləğv edəcək:\n\n${lines}\n\nMüştərilərə xəbər getməyəcək, özünüz zəng edin. Davam edək?`)) {
          saveBtn.disabled = false;
          return;
        }
      }
      const cancelQuery = stranded.length ? '&cancelBookingIds=' + stranded.map(b => b.id).join(',') : '';
      const r = await call('PUT', `/api/panel/windows?date=${saveDate}${cancelQuery}`, payload);
      if (r.status === 401) return sessionExpired();
      if (r.status === 200 && Array.isArray(r.data)) {
        if (date !== saveDate) { toast('Saxlanıldı', 'ok'); load(); return; }
        fromServer(r.data);
        dirty = false;
        note = { ok: true, text: 'Saxlanıldı' };
        if (stranded.length && showCancelled) showCancelled(stranded);
        if (reloadBookings) reloadBookings();
      } else {
        note = {
          ok: false,
          text: r.status === 409 ? (reloadBookings && reloadBookings(), 'Pəncərələr saxlanmadı: xidmət müddətləri yazılmayıb və ya yeni rezerv gəlib. Rezervlər yeniləndi, yenidən cəhd edin')
            : r.status === 400 ? 'Pəncərələr düzgün deyil (vaxt aralığı və ya üst-üstə düşmə)'
            : 'Xəta baş verdi, yenidən cəhd edin'
        };
      }
      render();
    };

    const unit = dur.HAIRCUT + dur.WASH + dur.BEARD;
    const fromSel = $('select');
    const toSel = $('select');
    for (let m = WORK_START; m < WORK_END; m += 15) fromSel.append($('option', { value: String(m), textContent: fmt(m) }));
    for (let m = WORK_START + 15; m <= WORK_END; m += 15) toSel.append($('option', { value: String(m), textContent: fmt(m) }));
    fromSel.value = String(autoFrom);
    toSel.value = String(autoTo);
    const preview = $('p', { className: 'muted' });
    const autoBtn = $('button', { className: 'green full', textContent: 'Bütün günü avtomatik yarat' });
    function showPreview() {
      const span = autoTo - autoFrom;
      const raw = Math.floor(span / unit);
      const n = Math.min(raw, MAX_WINDOWS);
      if (span <= 0) {
        preview.textContent = 'Bitmə vaxtı başlamadan sonra olmalıdır';
      } else if (n < 1) {
        preview.textContent = `Bu aralıq bir pəncərə üçün kifayət etmir (lazım: ${unit} dəq)`;
      } else {
        const left = span - n * unit;
        preview.textContent = `Hər pəncərə ${unit} dəq (3 kub). Bu aralıqda ${n} pəncərə yaranacaq` +
          (raw > n ? ` (ən çox ${MAX_WINDOWS})` : '') + `, ${left} dəq boş qalacaq.`;
      }
      autoBtn.disabled = n < 1;
    }
    fromSel.onchange = () => { autoFrom = parseInt(fromSel.value, 10); showPreview(); };
    toSel.onchange = () => { autoTo = parseInt(toSel.value, 10); showPreview(); };
    autoBtn.onclick = () => {
      const n = Math.min(Math.floor((autoTo - autoFrom) / unit), MAX_WINDOWS);
      if (n < 1) return;
      if (wins.length && !confirm('Bu gündəki mövcud pəncərələr əvəz olunacaq. Davam edək?')) return;
      wins = [];
      for (let i = 0; i < n; i++) wins.push({ manual: i === 0, start: autoFrom, cubes: KINDS.slice() });
      touch();
    };
    const autoBox = $('div', { className: 'auto' },
      $('b', { textContent: 'Bütün günü avtomatik yarat' }),
      $('p', { className: 'muted', textContent: 'İş saatlarını seçin, sistem aralığı pəncərələrə bölür. Hər pəncərədə 3 kub olur (saç kəsimi, saç yuma, saqqal kəsimi).' }),
      $('div', { className: 'two' },
        $('div', {}, $('label', { textContent: 'Başlama' }), fromSel),
        $('div', {}, $('label', { textContent: 'Bitmə' }), toSel)),
      preview, autoBtn);
    showPreview();

    const els = [
      title,
      $('p', { className: 'muted', textContent: `📅 ${d.getDate()} ${MONTHS[d.getMonth()]} · pəncərənin uzunluğu içindəki kubların cəmidir` }),
      autoBox,
      $('div', { className: 'wh' }, countSel, addBtn),
      $('div', { className: 'wh' }, fillBtn, clearBtn, delSel)
    ];
    if (wins.length) wins.forEach((w, i) => els.push(card(w, i, info[i])));
    else els.push($('p', { className: 'muted', textContent: 'Bu gün üçün iş aralığı yoxdur. Yuxarıdan pəncərə əlavə edin.' }));
    if (stale) els.push($('div', { className: 'stalenote', textContent: 'Xidmət müddətləri dəyişib. Saxlayanda pəncərələr yeni müddətlərlə hesablanacaq.' }));
    if (note) els.push($('div', { className: 'msg' + (note.ok ? ' ok' : ''), textContent: note.text }));
    els.push(saveBtn);
    box.replaceChildren(...els);
  }

  async function load() {
    const t = ++token;
    box.replaceChildren(title, $('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const [sv, wr] = await Promise.all([
      call('GET', '/api/panel/services'),
      call('GET', `/api/panel/windows?date=${date}`)
    ]);
    if (t !== token) return;
    if (sv.status === 401 || wr.status === 401) return sessionExpired();
    if (sv.status !== 200 || wr.status !== 200 || !sv.data || !Array.isArray(wr.data)) {
      box.replaceChildren(title, $('div', { className: 'msg', textContent: 'İş aralıqlarını yükləmək alınmadı. Səhifəni yeniləyin.' }));
      return;
    }
    setDurations(sv.data);
    fromServer(wr.data);
    dirty = false;
    note = null;
    render();
  }

  reloadWindows = load;
  windowsDirty = () => dirty;
  refreshDurations = async () => {
    const r = await call('GET', '/api/panel/services');
    if (r.status !== 200 || !r.data) return;
    const before = JSON.stringify(dur);
    setDurations(r.data);
    if (before !== JSON.stringify(dur) && wins.length) { stale = true; dirty = true; }
    render();
  };

  load();
  return box;
}

let dayBookings = [];
let reloadBookings = null;
let showCancelled = null;

function phoneNode(p) {
  return /^\+?[0-9]{9,15}$/.test(p)
    ? $('a', { href: 'tel:' + p, textContent: p })
    : $('span', { textContent: p });
}

function bookingsPanel() {
  const box = $('div', { className: 'panel' });
  const cancelledBox = $('div');
  const list = $('div');
  let kept = [];
  let token = 0;

  function renderCancelled() {
    if (!kept.length) { cancelledBox.replaceChildren(); return; }
    const close = $('button', { className: 'small ghost', textContent: 'Bağla' });
    close.onclick = () => { kept = []; renderCancelled(); };
    const wrap = $('div', { className: 'cancelled' },
      $('b', { textContent: 'Ləğv edilən rezervlər. Müştərilərə zəng edib xəbər verin:' }));
    kept.forEach(b => wrap.append($('div', { className: 'crow' },
      $('span', { textContent: `${b.start}–${b.end} · ${b.customerName}` }),
      phoneNode(b.customerPhone))));
    wrap.append(close);
    cancelledBox.replaceChildren(wrap);
  }

  showCancelled = items => {
    if (!items || !items.length) return;
    kept = kept.concat(items);
    renderCancelled();
  };

  function row(b) {
    const info = $('div', { className: 'info' }, $('b', { textContent: b.customerName }));
    info.append(phoneNode(b.customerPhone));
    info.append($('span', { textContent: `${b.services.map(x => x.name).join(' + ')} · ${b.minutes} dəq` }));
    const cancel = $('button', { className: 'small danger', textContent: 'Ləğv et' });
    cancel.onclick = async () => {
      if (!confirm(`${b.start}–${b.end} rezervi (${b.customerName}) ləğv edilsin? Müştəriyə xəbər getməyəcək, özünüz zəng edin.`)) return;
      cancel.disabled = true;
      const r = await call('POST', `/api/panel/bookings/${b.id}/cancel`);
      if (r.status === 401) return sessionExpired();
      if (r.status === 204) { showCancelled([b]); toast('Rezerv ləğv edildi', 'ok'); }
      else if (r.status === 404) toast('Bu rezerv artıq yoxdur', 'err');
      else toast('Xəta baş verdi', 'err');
      load();
    };
    return $('div', { className: 'row' },
      $('div', { className: 'time', textContent: b.start }), info, cancel);
  }

  async function load() {
    const t = ++token;
    list.replaceChildren($('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const r = await call('GET', `/api/panel/bookings?date=${date}`);
    if (t !== token) return;
    if (r.status === 401) return sessionExpired();
    if (r.status !== 200 || !Array.isArray(r.data)) {
      dayBookings = [];
      list.replaceChildren($('div', { className: 'msg', textContent: 'Rezervləri yükləmək alınmadı. Səhifəni yeniləyin.' }));
      return;
    }
    dayBookings = r.data;
    const d = new Date(date + 'T00:00:00');
    list.replaceChildren(
      $('p', { className: 'muted', textContent: `📅 ${d.getDate()} ${MONTHS[d.getMonth()]} · ${r.data.length} rezerv` }),
      ...(r.data.length ? r.data.map(row)
        : [$('p', { className: 'muted', textContent: 'Bu gün üçün rezerv yoxdur.' })]));
  }

  box.append($('h2', { textContent: 'Rezervlər' }), cancelledBox, list);
  reloadBookings = load;
  load();
  return box;
}

function showPanel() {
  logoutBtn.hidden = false;
  const dateInput = $('input', { type: 'date', value: date, min: todayKey, max: maxKey });
  const from = $('select');
  const to = $('select');
  for (let h = 9; h <= 20; h++) from.append($('option', { value: String(h), textContent: pad(h) + ':00' }));
  for (let h = 10; h <= 21; h++) to.append($('option', { value: String(h), textContent: pad(h) + ':00' }));
  from.value = '10';
  to.value = '18';
  const createNote = $('div');
  const createBtn = $('button', { className: 'green full', textContent: 'Saatları yarat' });
  const list = $('div');

  dateInput.onchange = () => {
    const v = dateInput.value;
    if (!v || v < todayKey || v > maxKey) {
      toast('Tarix bugündən 60 günlük aralıqda olmalıdır', 'err');
      dateInput.value = date;
      return;
    }
    if (windowsDirty() && !confirm('Saxlanılmamış pəncərə dəyişiklikləri var. Gün dəyişsin?')) {
      dateInput.value = date;
      return;
    }
    date = v;
    loadDay();
    if (reloadWindows) reloadWindows();
    if (reloadBookings) reloadBookings();
  };

  createBtn.onclick = async () => {
    createNote.className = ''; createNote.textContent = '';
    const f = +from.value, t = +to.value;
    if (t <= f) {
      createNote.className = 'msg';
      createNote.textContent = 'Bitmə saatı başlama saatından sonra olmalıdır';
      return;
    }
    createBtn.disabled = true;
    const r = await call('POST', '/api/panel/slots', { date, fromHour: f, toHour: t });
    createBtn.disabled = false;
    if (r.status === 401) return sessionExpired();
    if (r.status === 200 && r.data) {
      createNote.className = 'msg ok';
      createNote.textContent = `${r.data.created} saat yaradıldı, ${r.data.skipped} saat atlandı (artıq var və ya vaxtı keçib)`;
      loadDay();
    } else {
      createNote.className = 'msg';
      createNote.textContent =
        r.status === 400 ? 'Tarix və ya saat aralığı düzgün deyil' :
        r.status === 409 ? 'Eyni anda başqa dəyişiklik oldu, yenidən cəhd edin' :
        'Xəta baş verdi, yenidən cəhd edin';
    }
  };

  async function deleteSlot(x, time, btn) {
    if (!confirm(`${time} saatını silmək istəyirsiniz?`)) return;
    btn.disabled = true;
    const r = await call('DELETE', `/api/panel/slots/${x.id}`);
    if (r.status === 401) return sessionExpired();
    if (r.status === 204) toast('Saat silindi', 'ok');
    else if (r.status === 409) toast('Dolu saatı silmək olmaz, əvvəl rezervi ləğv edin', 'err');
    else if (r.status === 404) toast('Saat tapılmadı', 'err');
    else toast('Xəta baş verdi', 'err');
    loadDay();
  }

  async function cancelSlot(x, time, btn) {
    if (!confirm(`${time} saatındakı rezervi ləğv etmək istəyirsiniz? Müştəriyə xəbər getməyəcək.`)) return;
    btn.disabled = true;
    const r = await call('POST', `/api/panel/slots/${x.id}/cancel`);
    if (r.status === 401) return sessionExpired();
    if (r.status === 204) toast('Rezerv ləğv edildi, saat yenidən boşdur', 'ok');
    else if (r.status === 409) toast('Bu saat artıq rezerv olunmayıb', 'err');
    else if (r.status === 404) toast('Saat tapılmadı', 'err');
    else toast('Xəta baş verdi', 'err');
    loadDay();
  }

  function row(x) {
    const time = x.startTime.slice(11, 16);
    const info = $('div', { className: 'info' });
    const r = $('div', { className: 'row' }, $('div', { className: 'time', textContent: time }), info);
    r.append($('span', { className: 'chip ' + x.status.toLowerCase(), textContent: LABEL[x.status] || x.status }));
    if (x.status === 'BOOKED') {
      info.append($('b', { textContent: x.customerName || '—' }));
      if (x.customerPhone) {
        info.append(/^\+?[0-9]{9,15}$/.test(x.customerPhone)
          ? $('a', { href: 'tel:' + x.customerPhone, textContent: x.customerPhone })
          : $('span', { textContent: x.customerPhone }));
      }
      const b = $('button', { className: 'small danger', textContent: 'Ləğv et' });
      b.onclick = () => cancelSlot(x, time, b);
      r.append(b);
    } else if (x.status === 'FREE') {
      const b = $('button', { className: 'small ghost', textContent: 'Sil' });
      b.onclick = () => deleteSlot(x, time, b);
      r.append(b);
    }
    return r;
  }

  async function loadDay() {
    const token = ++dayToken;
    list.replaceChildren($('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const r = await call('GET', `/api/panel/day?date=${date}`);
    if (token !== dayToken) return;
    if (r.status === 401) return sessionExpired();
    if (r.status !== 200 || !Array.isArray(r.data)) {
      list.replaceChildren($('div', { className: 'msg', textContent: 'Saatları yükləmək alınmadı. Yenidən cəhd edin.' }));
      return;
    }
    const d = new Date(date + 'T00:00:00');
    const free = r.data.filter(x => x.status === 'FREE').length;
    const booked = r.data.filter(x => x.status === 'BOOKED').length;
    list.replaceChildren(
      $('h2', { textContent: `📅 ${d.getDate()} ${MONTHS[d.getMonth()]}` }),
      $('div', { className: 'summary' },
        $('span', { textContent: `Boş: ${free}` }), $('span', { textContent: `Dolu: ${booked}` }),
        $('span', { textContent: `Cəmi: ${r.data.length}` })),
      ...(r.data.length ? r.data.map(row)
        : [$('p', { className: 'muted', textContent: 'Bu gün üçün saat yoxdur. Yuxarıdan yarada bilərsiniz.' })]));
  }

  app.replaceChildren(
    $('div', { className: 'panel' },
      $('h2', { textContent: `${me.masterName} @ ${me.shopName}` }),
      $('label', { textContent: 'Gün' }), dateInput),
    bookingsPanel(),
    servicesPanel(),
    windowsPanel(),
    $('div', { className: 'panel' },
      $('p', { className: 'muted', textContent: 'Köhnə saatlıq rezervlər (müvəqqəti, müştəri sayı yeni modelə keçənə qədər)' }),
      list));
  loadDay();
}

logoutBtn.onclick = async () => {
  logoutBtn.disabled = true;
  await call('POST', '/api/logout');
  logoutBtn.disabled = false;
  showLogin('Çıxış edildi', true);
};

async function boot() {
  const r = await call('GET', '/api/panel/me');
  if (r.status === 200 && r.data) { me = r.data; showPanel(); }
  else if (r.status === 401) showLogin();
  else app.replaceChildren($('div', { className: 'msg', textContent: 'Serverə qoşulmaq alınmadı. Səhifəni yeniləyin.' }));
}
boot();
</script>
