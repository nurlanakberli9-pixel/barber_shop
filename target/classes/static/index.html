<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarberConnect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#eef0f4;color:#1c2536}
header{background:#fff;padding:14px 16px;font-size:20px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}
main{max-width:960px;margin:0 auto;padding:16px}
.hero{background:#3f5470;color:#fff;border-radius:14px;padding:18px;margin-bottom:16px}
.hero h1{margin:0 0 12px;font-size:20px;text-align:center}
.hero input{width:100%;border:0;border-radius:10px;padding:12px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);text-align:center;padding-bottom:12px;cursor:pointer}
.card .top{background:#3f5470;height:46px}
.avatar{width:72px;height:72px;border-radius:50%;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:-36px auto 8px;border:3px solid #fff}
.card b{display:block;font-size:16px}
.card .shop{font-size:13px;color:#555;padding:0 8px;min-height:34px}
.stars{color:#f5a623;font-size:14px;margin:4px 0 8px}
.btn{background:#22a845;color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer;width:calc(100% - 24px)}
.btn:active{background:#1b8a39}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:#3f5470;font:inherit;cursor:pointer;padding:0;margin-bottom:12px}
.panel{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.head{display:flex;align-items:center;gap:12px}
.head .avatar{margin:0;width:56px;height:56px;flex:0 0 56px;font-size:22px}
.head h2{margin:0;font-size:18px}
.head .stars{margin:2px 0}
.muted{color:#667;font-size:14px}
.msg{padding:12px;border-radius:10px;background:#fde2e2;color:#a11;margin-top:10px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthbar b{font-size:17px}
.arrow{width:42px;height:42px;border-radius:10px;border:1px solid #d5d9e0;background:#fff;font-size:20px;cursor:pointer}
.arrow:disabled{opacity:.35;cursor:default}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;position:relative}
.day{flex:0 0 58px;background:#fff;border:1px solid #d5d9e0;border-radius:12px;padding:8px 0;text-align:center;font:inherit;color:inherit;cursor:pointer}
.day small{display:block;font-size:11px;color:#667}
.day b{display:block;font-size:20px}
.day.sel{background:#3f5470;color:#fff;border-color:#3f5470}
.day.sel small{color:#cfd8e6}
.day:disabled{opacity:.4;cursor:default}
.bars{display:flex;gap:2px;justify-content:center;margin-top:6px}
.bars i{width:7px;height:7px;border-radius:2px;background:#ccd}
.bars i.g{background:#22a845}
.bars i.r{background:#a32020}
.gapline{font-size:14px;color:#146c2e;background:#d9f5e0;border-radius:10px;padding:8px 10px;margin-top:8px}
.wcard{background:#fff;border:1px solid #d5d9e0;border-radius:12px;padding:12px;margin-top:10px;cursor:pointer}
.wcard.full{opacity:.55;cursor:default}
.wcard .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.okfree{color:#1b8a39;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:#eef0f4;border-radius:8px;padding:3px 8px;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow-y:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;background:#3f5470;color:#fff;margin:-16px -16px 12px;padding:14px 16px;border-radius:18px 18px 0 0}
.sheet .bar b{font-size:17px}
.x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eceef2}
.row span{color:#667}
.sheet input{width:100%;margin-top:10px;padding:12px;border:1px solid #ccd;border-radius:10px;font:inherit}
.sheet .btn{width:100%;margin-top:14px;padding:14px}
.cubes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cubebtn{font:inherit;text-align:left;border:1px solid #c5ccd8;border-radius:10px;background:#fff;color:#1c2536;padding:12px;cursor:pointer}
.cubebtn.on{background:#3f5470;color:#fff;border-color:#3f5470}
.cubebtn:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;z-index:30;max-width:90%;text-align:center}
.toast.ok{background:#1b8a39}
.toast.err{background:#a32020}
</style>
</head>
<body>
<header>✂ BarberConnect</header>
<main id="app"></main>
<script>
const app = document.getElementById('app');
const $ = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); e.append(...k); return e; };
const COLORS = ['#c0562f', '#2f7bc0', '#7b4fc0', '#2fa086', '#b8860b', '#c02f6b'];
const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
const WD = ['Baz', 'B.e', 'Ç.a', 'Çər', 'C.a', 'Cüm', 'Şən'];
const ICONS = { HAIRCUT: '✂️', WASH: '🚿', BEARD: '🧔' };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let shops = [];
let query = '';

function toast(text, type) {
  const t = $('div', { className: 'toast ' + type, textContent: text });
  document.body.append(t);
  setTimeout(() => t.remove(), 4500);
}
function avatar(s) {
  const a = $('div', { className: 'avatar', textContent: s.masterName.slice(0, 1).toUpperCase() });
  a.style.background = COLORS[s.id % COLORS.length];
  return a;
}
function stars(r) {
  const full = Math.round(r);
  return '★'.repeat(full) + '☆'.repeat(5 - full) + ' ' + r.toFixed(1);
}
async function getJson(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return { status: r.status, data: null };
    return { status: r.status, data: await r.json() };
  } catch (e) {
    return { status: 0, data: null };
  }
}

function homeView() {
  const search = $('input', { type: 'search', placeholder: 'Bərbər, usta və ya ünvan axtarın...', value: query });
  const grid = $('div', { className: 'grid' });
  search.oninput = () => { query = search.value; fill(); };
  function fill() {
    const q = query.trim().toLowerCase();
    const list = shops.filter(s =>
      (s.name + ' ' + s.masterName + ' ' + s.address).toLowerCase().includes(q));
    grid.replaceChildren(...(list.length ? list.map(card)
      : [$('p', { className: 'muted', textContent: 'Heç nə tapılmadı' })]));
  }
  fill();
  app.replaceChildren(
    $('div', { className: 'hero' }, $('h1', { textContent: 'Bərbər seçin' }), search),
    grid);
}

function card(s) {
  const btn = $('button', { className: 'btn', textContent: 'BOOK NOW' });
  const c = $('div', { className: 'card' },
    $('div', { className: 'top' }), avatar(s),
    $('b', { textContent: s.masterName + ' @' }),
    $('div', { className: 'shop', textContent: s.name }),
    $('div', { className: 'stars', textContent: stars(s.rating) }),
    btn);
  c.onclick = () => shopView(s);
  return c;
}

async function shopView(s) {
  const back = $('button', { className: 'link', textContent: '← Bütün bərbərlər' });
  back.onclick = homeView;
  const head = $('div', { className: 'panel head' }, avatar(s),
    $('div', {},
      $('h2', { textContent: s.masterName + ' @ ' + s.name }),
      $('div', { className: 'stars', textContent: stars(s.rating) }),
      $('div', { className: 'muted', textContent: '📍 ' + s.address })));
  app.replaceChildren(back, head, $('p', { className: 'muted', textContent: 'Yüklənir...' }));

  let avail = {};
  async function loadCalendar() {
    const r = await getJson(`/api/shops/${s.id}/calendar?days=60`);
    if (r.status !== 200 || !Array.isArray(r.data) || !r.data.length) return false;
    avail = {};
    r.data.forEach(d => { avail[d.date] = d; });
    return true;
  }
  if (!(await loadCalendar())) {
    app.replaceChildren(back, head, $('div', { className: 'msg', textContent: 'Tarixləri yükləmək alınmadı. Yenidən cəhd edin.' }));
    return;
  }

  const todayKey = iso(new Date());
  const keys = Object.keys(avail).sort();
  const minMonth = new Date(); minMonth.setDate(1);
  const last = new Date(keys[keys.length - 1] + 'T00:00:00');
  const maxMonth = new Date(last.getFullYear(), last.getMonth(), 1);
  let month = new Date(minMonth.getFullYear(), minMonth.getMonth(), 1);
  let selected = todayKey;
  let buttons = {};
  let dayToken = 0;

  const label = $('b');
  const prev = $('button', { className: 'arrow', textContent: '‹', ariaLabel: 'Əvvəlki ay' });
  const next = $('button', { className: 'arrow', textContent: '›', ariaLabel: 'Növbəti ay' });
  const strip = $('div', { className: 'strip' });
  const detail = $('div', { className: 'panel' });
  const monthbar = $('div', { className: 'monthbar' }, prev, label, next);

  function bars(key, past) {
    const st = avail[key];
    const wrap = $('div', { className: 'bars' });
    let g = 0, red = false;
    if (!past && st && st.windowMinutes > 0) {
      red = true;
      if (st.freeMinutes > 0) g = Math.max(1, Math.round(st.freeMinutes / st.windowMinutes * 5));
    }
    for (let i = 0; i < 5; i++) wrap.append($('i', { className: i < g ? 'g' : red ? 'r' : '' }));
    return wrap;
  }

  function buildStrip() {
    buttons = {};
    const y = month.getFullYear(), m = month.getMonth();
    label.textContent = MONTHS[m] + ' ' + y;
    prev.disabled = month <= minMonth;
    next.disabled = month >= maxMonth;
    const n = new Date(y, m + 1, 0).getDate();
    const items = [];
    for (let d = 1; d <= n; d++) {
      const date = new Date(y, m, d);
      const key = iso(date);
      const past = key < todayKey;
      const b = $('button', { className: 'day', disabled: past || !avail[key] },
        $('small', { textContent: WD[date.getDay()] }),
        $('b', { textContent: String(d) }),
        bars(key, past));
      b.onclick = () => select(key);
      buttons[key] = b;
      items.push(b);
    }
    strip.replaceChildren(...items);
    markSelected();
  }

  function markSelected() {
    Object.entries(buttons).forEach(([k, b]) => b.classList.toggle('sel', k === selected));
    const b = buttons[selected];
    if (b) strip.scrollLeft = b.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2;
    renderDetail();
  }

  function select(key) { selected = key; markSelected(); }

  function windowCard(x) {
    const minCube = Math.min(...x.cubes.map(c => c.minutes));
    const full = x.fitMinutes < minCube;
    const tags = $('div', { className: 'tags' },
      ...x.cubes.map(c => $('span', { className: 'tag', textContent: `${ICONS[c.code] || ''} ${c.name} · ${c.minutes} dəq` })));
    const c = $('div', { className: 'wcard' + (full ? ' full' : '') },
      $('div', { className: 'top' },
        $('span', { textContent: `${x.start} – ${x.end}` }),
        $('span', { className: full ? 'muted' : 'okfree', textContent: full ? 'Dolu' : `Boş: ${x.freeMinutes} dəq` })),
      tags);
    if (!full) c.onclick = () => openSheet(x);
    return c;
  }

  async function renderDetail() {
    const token = ++dayToken;
    const d = new Date(selected + 'T00:00:00');
    detail.replaceChildren($('p', { className: 'muted', textContent: 'Yüklənir...' }));
    const [w, g] = await Promise.all([
      getJson(`/api/shops/${s.id}/windows?date=${selected}`),
      getJson(`/api/shops/${s.id}/gaps?date=${selected}`)
    ]);
    if (token !== dayToken) return;
    if (w.status !== 200 || !Array.isArray(w.data)) {
      detail.replaceChildren($('div', { className: 'msg', textContent: 'Məlumatı yükləmək alınmadı. Başqa gün seçib yenidən cəhd edin.' }));
      return;
    }
    const els = [$('b', { textContent: `📅 ${d.getDate()} ${MONTHS[d.getMonth()]}, ${WD[d.getDay()]}` })];
    if (!w.data.length) {
      els.push($('p', { className: 'muted', textContent: 'Bu gün üçün bərbərin iş aralığı yoxdur.' }));
      detail.replaceChildren(...els);
      return;
    }
    if (g.status === 200 && Array.isArray(g.data) && g.data.length) {
      els.push($('div', { className: 'gapline', textContent: 'Boş vaxt: ' + g.data.map(x => `${x.start}–${x.end} (${x.minutes} dəq)`).join(', ') }));
    }
    w.data.forEach(x => els.push(windowCard(x)));
    detail.replaceChildren(...els);
  }

  async function refreshAll() {
    await loadCalendar();
    buildStrip();
  }

  function openSheet(w) {
    const d = new Date(selected + 'T00:00:00');
    const dateText = `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
    const chosen = new Set();
    const total = () => w.cubes.filter(c => chosen.has(c.code)).reduce((a, c) => a + c.minutes, 0);
    const row = (k, v) => $('div', { className: 'row' }, $('span', { textContent: k }), $('b', { textContent: v }));
    const cubeBox = $('div', { className: 'cubes' });
    const sum = $('p', { className: 'muted' });
    const name = $('input', { placeholder: 'Adınız', maxLength: 60, autocomplete: 'name' });
    const phone = $('input', { placeholder: '+994501234567', type: 'tel', maxLength: 16, autocomplete: 'tel' });
    const err = $('div');
    const ok = $('button', { className: 'btn', textContent: 'TƏSDİQ ET' });
    const close = $('button', { className: 'x', textContent: '✕', ariaLabel: 'Bağla' });
    const overlay = $('div', { className: 'overlay' });

    function paint() {
      const t = total();
      cubeBox.replaceChildren(...w.cubes.map(c => {
        const on = chosen.has(c.code);
        const b = $('button', {
          type: 'button',
          className: 'cubebtn' + (on ? ' on' : ''),
          textContent: `${ICONS[c.code] || ''} ${c.name} · ${c.minutes} dəq`,
          disabled: !on && t + c.minutes > w.fitMinutes
        });
        b.onclick = () => { if (on) chosen.delete(c.code); else chosen.add(c.code); paint(); };
        return b;
      }));
      sum.textContent = t
        ? `Seçildi: ${t} dəq (bu pəncərədə ən çox ${w.fitMinutes} dəq sığır)`
        : `Xidmət seçin (bu pəncərədə ən çox ${w.fitMinutes} dəq sığır)`;
      ok.disabled = t === 0;
    }

    ok.onclick = async () => {
      err.className = ''; err.textContent = '';
      const n = name.value.trim();
      const p = phone.value.trim();
      if (!n || !/^\+?[0-9]{9,15}$/.test(p)) {
        err.className = 'msg';
        err.textContent = 'Ad və düzgün telefon yazın (məs. +994501234567)';
        return;
      }
      ok.disabled = true;
      let status = 0, data = null;
      try {
        const r = await fetch(`/api/shops/${s.id}/windows/${w.id}/bookings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ services: [...chosen], name: n, phone: p })
        });
        status = r.status;
        if (status === 200) data = await r.json();
      } catch (e) { status = 0; }
      if (status === 200 && data) {
        overlay.remove();
        toast(`Rezerv olundu: ${s.masterName}, ${dateText}, ${data.start}–${data.end}`, 'ok');
        refreshAll();
      } else if (status === 409) {
        overlay.remove();
        toast('Bu pəncərədə yer qalmayıb, boş vaxtlara yenidən baxın', 'err');
        refreshAll();
      } else if (status === 404) {
        overlay.remove();
        toast('Pəncərə tapılmadı, siyahı yenilənir', 'err');
        refreshAll();
      } else {
        ok.disabled = false;
        err.className = 'msg';
        err.textContent = status === 400
          ? 'Ad, telefon və ya xidmət seçimi düzgün deyil'
          : 'Xəta baş verdi, bağlantını yoxlayıb yenidən cəhd edin';
      }
    };

    close.onclick = () => overlay.remove();
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    const sheet = $('div', { className: 'sheet' },
      $('div', { className: 'bar' }, $('b', { textContent: 'One-Tap Rezerv' }), close),
      row('Bərbər', s.masterName), row('Salon', s.name), row('Tarix', dateText),
      row('Pəncərə', `${w.start} – ${w.end}`),
      cubeBox, sum, name, phone, err, ok);
    overlay.append(sheet);
    document.body.append(overlay);
    paint();
  }

  prev.onclick = () => {
    month = new Date(month.getFullYear(), month.getMonth() - 1, 1);
    selected = iso(month) >= todayKey ? iso(month) : todayKey;
    buildStrip();
  };
  next.onclick = () => {
    month = new Date(month.getFullYear(), month.getMonth() + 1, 1);
    selected = iso(month);
    buildStrip();
  };

  app.replaceChildren(back, head, monthbar, strip, detail);
  buildStrip();
}

async function init() {
  const r = await getJson('/api/shops');
  if (r.status !== 200 || !Array.isArray(r.data)) {
    app.replaceChildren($('div', { className: 'msg', textContent: 'Bərbərləri yükləmək alınmadı. Səhifəni yeniləyin.' }));
    return;
  }
  shops = r.data;
  homeView();
}
init();
</script>
</body>
</html>
